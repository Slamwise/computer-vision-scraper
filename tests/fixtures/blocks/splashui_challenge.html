<!DOCTYPE html>
<!-- Synthetic test fixture: eBay's own bot challenge, reached by a redirect to
     /splashui/challenge?ap=1&appName=orch&ru=<original search URL>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Measure</title>
<style>
  body { font-family: "Market Sans", Arial, sans-serif; margin: 0; color: #191919; background: #fff; }
  #gh { padding: 16px 24px; border-bottom: 1px solid #e5e5e5; }
  .page-notice { max-width: 560px; margin: 48px auto; padding: 0 24px; }
  h1 { font-size: 24px; }
  .h-captcha { margin: 24px 0; min-height: 78px; }
  .btn { background: #3665f3; color: #fff; border: 0; border-radius: 20px; padding: 10px 28px; font-size: 16px; }
</style>
<script src="https://hcaptcha.com/1/api.js?hl=en" async defer></script>
</head>
<body>
<div id="gh"><a href="https://www.ebay.com/" aria-label="eBay Home"><svg width="80" height="32" role="img" aria-label="eBay"><text x="0" y="24" font-size="28" font-weight="700">ebay</text></svg></a></div>
<div class="page-notice" role="main">
  <h1 id="s0-0-0-heading">Please verify yourself to continue</h1>
  <p>To keep eBay a safe place to buy and sell, we will occasionally ask you to verify yourself.
     This helps us to block unauthorized users from entering our site.</p>
  <form id="captcha_form" method="POST" action="/splashui/challenge">
    <input type="hidden" name="ru" value="https://www.ebay.com/sch/i.html?_nkw=hot+wheels&amp;LH_Sold=1&amp;LH_Complete=1">
    <input type="hidden" name="appName" value="orch">
    <div class="h-captcha" id="s0-0-0-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001" data-callback="onCaptchaSolved">
      <iframe src="https://newassets.hcaptcha.com/captcha/v1/a1b2c3d/static/hcaptcha.html#frame=checkbox&amp;id=0x1a2b3c&amp;host=www.ebay.com&amp;sitekey=10000000-ffff-ffff-ffff-000000000001&amp;theme=light"
              title="Widget containing checkbox for hCaptcha security challenge" tabindex="0" frameborder="0" scrolling="no"
              data-hcaptcha-widget-id="0x1a2b3c" data-hcaptcha-response="" style="width: 303px; height: 78px; overflow: hidden;"></iframe>
      <textarea id="h-captcha-response-0x1a2b3c" name="h-captcha-response" style="display: none;"></textarea>
    </div>
    <button class="btn" type="submit">Continue</button>
  </form>
  <p><a href="https://www.ebay.com/help/account/protecting-account/security-measures?id=4204">Why am I seeing this?</a></p>
</div>
</body>
</html>
