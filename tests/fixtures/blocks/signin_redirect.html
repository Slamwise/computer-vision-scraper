<!DOCTYPE html>
<!-- Synthetic test fixture: where eBay sends a session it wants signed in,
     e.g. https://signin.ebay.com/ws/eBayISAPI.dll?SignIn&ru=<original search URL>. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in or Register | eBay</title>
<style>
  body { font-family: "Market Sans", Arial, sans-serif; margin: 0; color: #191919; }
  #signin-container { max-width: 400px; margin: 48px auto; padding: 0 24px; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #8f8f8f; border-radius: 8px; }
  .btn { width: 100%; background: #3665f3; color: #fff; border: 0; border-radius: 24px; padding: 12px; font-size: 16px; }
</style>
</head>
<body>
<div id="signin-container">
  <h1 id="greeting-msg">Hello</h1>
  <p>Sign in to eBay or <a href="https://signup.ebay.com/pa/crte?ru=https%3A%2F%2Fwww.ebay.com%2F">create an account</a></p>
  <form id="signin-form" method="post" action="https://signin.ebay.com/signin/s">
    <label for="userid">Email or username</label>
    <input id="userid" name="userid" type="text" autocomplete="username">
    <input type="hidden" name="ru" value="https://www.ebay.com/sch/i.html?_nkw=hot+wheels&amp;LH_Sold=1&amp;LH_Complete=1">
    <button id="signin-continue-btn" class="btn" type="submit">Continue</button>
  </form>
</div>
</body>
</html>
